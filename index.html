<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Randomizzatore Format Urbex</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --bg-soft: #0f141b;
      --card: rgba(18, 24, 33, 0.82);
      --card-strong: rgba(26, 34, 45, 0.95);
      --text: #f3f7fb;
      --muted: #95a3b5;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #7be0b8;
      --accent-strong: #4bcf9f;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --transition: 180ms ease;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font);
      background:
        radial-gradient(circle at top, rgba(123, 224, 184, 0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(92, 140, 255, 0.10), transparent 26%),
        linear-gradient(180deg, #05070a 0%, #0a0f16 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(100%, 760px);
      position: relative;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: -32px;
      background:
        radial-gradient(circle at 20% 20%, rgba(123, 224, 184, 0.12), transparent 24%),
        radial-gradient(circle at 80% 70%, rgba(76, 152, 255, 0.12), transparent 26%);
      filter: blur(36px);
      z-index: 0;
      pointer-events: none;
    }

    .panel {
      position: relative;
      z-index: 1;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(14, 18, 25, 0.88), rgba(10, 13, 18, 0.96));
      box-shadow: var(--shadow);
      padding: 32px;
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: clamp(2rem, 5vw, 3.3rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition),
        opacity var(--transition),
        box-shadow var(--transition);
    }

    button:active {
      transform: translateY(1px) scale(0.995);
    }

    button:focus-visible {
      outline: 2px solid rgba(123, 224, 184, 0.8);
      outline-offset: 3px;
    }

    .primary {
      min-width: min(100%, 320px);
      padding: 18px 28px;
      border-radius: 999px;
      font-size: 1.02rem;
      font-weight: 800;
      color: #07110d;
      background: linear-gradient(135deg, var(--accent), #b7ffd8);
      box-shadow: 0 16px 40px rgba(75, 207, 159, 0.18);
    }

    .primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 46px rgba(75, 207, 159, 0.24);
    }

    .secondary-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .secondary {
      padding: 11px 16px;
      border-radius: 999px;
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-1px);
    }

    .secondary:disabled {
      opacity: 0.46;
      cursor: not-allowed;
    }

    .card {
      min-height: 290px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 24%),
        var(--card);
      padding: 24px;
      display: grid;
      gap: 18px;
      align-content: start;
      opacity: 0;
      transform: translateY(10px) scale(0.985);
      transition:
        opacity 260ms ease,
        transform 260ms ease,
        border-color 260ms ease,
        background 260ms ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      border-color: rgba(123, 224, 184, 0.18);
      background:
        linear-gradient(180deg, rgba(123, 224, 184, 0.06), transparent 28%),
        var(--card-strong);
    }

    .card.empty {
      place-items: center;
      align-content: center;
      text-align: center;
      color: var(--muted);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .content {
      display: grid;
      gap: 14px;
    }

    .label {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .value {
      margin: 0;
      line-height: 1.2;
    }

    .pillar {
      font-size: clamp(1.2rem, 3.2vw, 1.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .format {
      font-size: clamp(1rem, 2.6vw, 1.18rem);
      color: #d9e4ef;
      font-weight: 700;
    }

    .hook {
      font-size: clamp(1.2rem, 4vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .note {
      color: #c2cfdb;
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .copied {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 16px);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(11, 16, 22, 0.92);
      border: 1px solid rgba(123, 224, 184, 0.18);
      color: var(--text);
      font-size: 0.92rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      backdrop-filter: blur(12px);
    }

    .copied.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .panel {
        padding: 22px;
        border-radius: 24px;
      }

      .card {
        min-height: 270px;
        padding: 20px;
      }

      .primary {
        width: 100%;
      }

      .secondary-row {
        width: 100%;
      }

      .secondary {
        flex: 1 1 0;
        min-width: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    </section>
  </main>

          <div>
            <p class="label">Hook</p>
            <p class="value hook">${selection.hook}</p>
          </div>
          <div>
            <p class="label">Come usarlo</p>
            <p class="value note">${selection.note}</p>
          </div>
        </div>
      `;

      requestAnimationFrame(() => {
        resultCard.classList.add("visible");
      });
    }

    function generateFormat() {
      const chosenFormat = pickRandom(formats);
      currentSelection = {
        ...chosenFormat,
        hook: pickRandom(chosenFormat.hooks)
      };

      renderCard(currentSelection);
      regenerateBtn.disabled = false;
      copyBtn.disabled = false;
    }

    async function copyHook() {
      if (!currentSelection) return;

      try {
        await navigator.clipboard.writeText(currentSelection.hook);
        showToast("Hook copiato");
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = currentSelection.hook;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "absolute";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showToast("Hook copiato");
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1700);
    }

    generateBtn.addEventListener("click", generateFormat);
    regenerateBtn.addEventListener("click", generateFormat);
    copyBtn.addEventListener("click", copyHook);
  </script>
</body>
</html>
